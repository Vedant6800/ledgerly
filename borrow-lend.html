<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow & Lend - Ledgerly</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="borrow-lend.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="header-text">
                    <h1 class="app-name">Borrow & Lend</h1>
                    <p class="app-subtitle">Track money you owe and money owed to you</p>
                </div>
                <div class="header-actions">
                    <nav class="primary-nav" aria-label="Primary navigation">
                        <a href="index.html" class="nav-tab">
                            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5M9 21v-6h6v6"/></svg><span>Ledger</span>
                        </a>
                        <a href="reports.html" class="nav-tab">
                            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/></svg><span>Reports</span>
                        </a>
                        <a href="borrow-lend.html" class="nav-tab active" aria-current="page">
                            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 11V7a2 2 0 1 1 4 0v4M12 11V5a2 2 0 1 1 4 0v7M16 12V8a2 2 0 1 1 4 0v6c0 4-2 7-7 7h-1c-3 0-5-1-7-4l-2-3a2 2 0 0 1 3-2l2 2V7a2 2 0 1 1 4 0v4"/></svg><span>Debts / Lending</span>
                        </a>
                    </nav>
                    <span class="sync-status sync-status--idle" id="header-sync-status" role="status"><span class="sync-status-dot"></span><span class="sync-status-label">GitHub sync ready</span></span>
                    <button class="theme-toggle" id="theme-toggle" title="Toggle theme">
                        <svg class="theme-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner"></div>
                <p class="loading-text">Loading Borrow & Lend data...</p>
            </div>

            <section class="summary-cards bl-summary">
                <div class="summary-card expense-card"><p class="card-label">You Owe</p><p class="card-value" id="bl-liabilities">₹0.00</p></div>
                <div class="summary-card income-card"><p class="card-label">You're Owed</p><p class="card-value" id="bl-receivables">₹0.00</p></div>
                <div class="summary-card balance-card"><p class="card-label">Net Position</p><p class="card-value" id="bl-net-position">₹0.00</p></div>
            </section>

            <section class="bl-panel">
                <h2 class="section-title">Add Borrow & Lend Record</h2>
                <form id="record-form" class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="record-type">Type</label>
                        <select id="record-type" class="form-input"><option value="borrowed">Borrowed</option><option value="lent">Lent</option></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="person-name">Person</label>
                        <input id="person-name" class="form-input" list="people-list" placeholder="Search or enter a person" autocomplete="off" required>
                        <datalist id="people-list"></datalist>
                    </div>
                    <div class="form-group"><label class="form-label" for="record-amount">Amount</label><input id="record-amount" class="form-input" type="number" min="0.01" step="0.01" required></div>
                    <div class="form-group"><label class="form-label" for="record-date">Date</label><input id="record-date" class="form-input" type="date" required></div>
                    <div class="form-group form-group-wide"><label class="form-label" for="record-description">Description</label><input id="record-description" class="form-input"></div>
                    <div class="form-group form-group-wide"><label class="form-label" for="record-notes">Notes</label><textarea id="record-notes" class="form-input" rows="2"></textarea></div>
                    <div class="form-actions form-group-wide"><button class="btn btn-primary" type="submit">Save Record</button></div>
                </form>
            </section>

            <section class="bl-panel">
                <div class="bl-toolbar">
                    <h2 class="section-title">Records</h2>
                    <div class="bl-record-filters">
                        <label class="sr-only" for="record-person-filter">Filter by person</label>
                        <select id="record-person-filter" class="form-input">
                            <option value="">All people</option>
                        </select>
                        <label class="sr-only" for="record-search">Search records</label>
                        <input id="record-search" class="form-input" placeholder="Search person or description">
                    </div>
                </div>
                <div id="record-list"></div>
                <p id="record-empty" class="bl-empty">No Borrow & Lend records yet.</p>
            </section>
        </div>
    </main>

    <script src="github-api.js"></script>
    <script src="borrow-lend.js"></script>
</body>
</html>
